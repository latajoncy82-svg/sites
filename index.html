<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04050A">
<title>Vertex Studio — Katalog linków</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2304050A'/%3E%3Cline x1='32' y1='10' x2='32' y2='22' stroke='%23FF5A36' stroke-width='2.5'/%3E%3Cline x1='32' y1='42' x2='32' y2='54' stroke='%23FF5A36' stroke-width='2.5'/%3E%3Cline x1='10' y1='32' x2='22' y2='32' stroke='%23FF5A36' stroke-width='2.5'/%3E%3Cline x1='42' y1='32' x2='54' y2='32' stroke='%23FF5A36' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23FF5A36'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --border-color: #FF5A36;
    --border-color-hover: #FF7A57;
    --bg: #04050A;
    --surface: rgba(15, 25, 40, 0.4);
    --ink: #F0F6FC;
    --muted: #8B9BB4;
    --inactive-border: #1C2D40;
    --inactive-text: #4A6178;
    --grid-line: rgba(159, 196, 255, 0.02);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  /* Tło - delikatne kule (Orbs) */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.08;
    animation: floatOrb 30s ease-in-out infinite;
  }
  .orb-1 { width: 600px; height: 600px; background: #FF5A36; top: 10%; left: -10%; }
  .orb-2 { width: 500px; height: 500px; background: #00E08C; bottom: 0%; right: -10%; animation-delay: -8s; }

  @keyframes floatOrb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(80px, -50px) scale(1.1); }
    66% { transform: translate(-50px, 60px) scale(0.9); }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: -2;
    pointer-events: none;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--inactive-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::selection { background: var(--border-color); color: var(--bg); }

  /* ---------- HERO Z CZARNĄ DZIURĄ ---------- */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 700px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    background: radial-gradient(circle at center, #0A0E1A 0%, #04050A 100%);
  }

  /* Canvas dla cząsteczek wpadających do dziury */
  #spaceCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Kontener na CSS'ową Czarną Dziurę */
  .black-hole-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(400px, 70vmin, 700px);
    height: clamp(400px, 70vmin, 700px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* Akrecyjny Dysk (Płaski, obracający się pierścień gazu) */
  .accretion-disk {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transform: rotateX(75deg);
    z-index: 1;
  }

  .disk-layer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg, 
      transparent 0%, 
      rgba(255, 90, 54, 0.1) 10%,
      #FF5A36 20%, 
      #FF9050 30%, 
      #FFFFFF 40%, 
      #FFD700 50%, 
      #FF5A36 70%, 
      rgba(255, 90, 54, 0.1) 90%,
      transparent 100%
    );
    filter: blur(15px);
    animation: spinDisk 8s linear infinite;
    mask: radial-gradient(circle, transparent 14%, black 16%, black 48%, transparent 52%);
    -webkit-mask: radial-gradient(circle, transparent 14%, black 16%, black 48%, transparent 52%);
  }

  .disk-layer.outer {
    filter: blur(40px);
    opacity: 0.6;
    animation-duration: 15s;
    mask: radial-gradient(circle, transparent 10%, black 15%, black 50%, transparent 55%);
    -webkit-mask: radial-gradient(circle, transparent 10%, black 15%, black 50%, transparent 55%);
  }

  @keyframes spinDisk {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Horyzont Zdarzeń (Sama czarna kula) */
  .event-horizon {
    position: absolute;
    width: 28%;
    height: 28%;
    background: #000000;
    border-radius: 50%;
    z-index: 3;
    box-shadow: 
      0 0 50px 20px rgba(0, 0, 0, 0.8),
      inset 0 0 50px 10px rgba(0, 0, 0, 1);
  }

  /* Pierścień Fotonowy (Świetlisty ring na krawędzi dziury) */
  .photon-ring {
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    box-shadow: 
      0 0 30px 2px rgba(255, 200, 100, 0.4),
      0 0 60px 4px rgba(255, 90, 54, 0.6),
      inset 0 0 20px 2px rgba(255, 200, 100, 0.2);
    z-index: 2;
    animation: photonPulse 4s ease-in-out infinite;
  }

  @keyframes photonPulse {
    0%, 100% { box-shadow: 0 0 30px 2px rgba(255, 200, 100, 0.4), 0 0 60px 4px rgba(255, 90, 54, 0.6), inset 0 0 20px 2px rgba(255, 200, 100, 0.2); }
    50% { box-shadow: 0 0 40px 4px rgba(255, 200, 100, 0.6), 0 0 80px 8px rgba(255, 90, 54, 0.8), inset 0 0 30px 4px rgba(255, 200, 100, 0.4); }
  }

  /* Światło odbite od dysku */
  .disk-glow {
    position: absolute;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(255, 90, 54, 0.2) 0%, transparent 60%);
    filter: blur(30px);
    z-index: 0;
    animation: glowPulse 6s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  /* Tekst Hero */
  .hero-text {
    position: relative;
    z-index: 10;
    text-align: center;
    width: 100%;
    padding: 0 20px;
    pointer-events: none;
    will-change: transform;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .eyebrow-hero {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 32px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(4, 7, 15, 0.7);
    padding: 10px 18px;
    border-radius: 30px;
    border: 1px solid var(--inactive-border);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    opacity: 0;
    animation: fadeInUp 1s 0.2s forwards;
    pointer-events: auto;
  }

  .eyebrow-hero::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--border-color);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--border-color);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  .wordmark {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.04em;
    font-size: clamp(64px, 16vw, 180px);
    line-height: 0.85;
    color: #F0F6FC;
    background: linear-gradient(180deg, #FFFFFF 0%, #5A6B7D 100%);
    -webkit-background-clip: text;
    background-clip: text;
    clip-path: inset(100% 0 0 0);
    animation: textReveal 1.4s 0.4s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    text-shadow: 0 10px 80px rgba(0,0,0,0.9);
  }

  @keyframes textReveal { to { clip-path: inset(0 0 0 0); } }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scroll-indicator {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeInUp 1s 1.4s forwards;
    z-index: 10;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, var(--muted));
    position: relative;
    overflow: hidden;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 40px;
    background: var(--border-color);
    animation: scrollDown 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes scrollDown {
    0% { top: -40px; }
    100% { top: 40px; }
  }

  /* ---------- Reszta strony ---------- */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 120px 24px 100px;
    position: relative;
    z-index: 10;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 60px;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--inactive-border);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    display: block;
  }

  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(36px, 6vw, 56px);
    margin: 0;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-weight: 700;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  /* Karty 4.0 - z efektem holograficznym dla nieaktywnych */
  .card {
    position: relative;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--inactive-border);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                opacity 0.6s ease, 
                border-color 0.4s ease, 
                box-shadow 0.4s ease;
    overflow: hidden;
    
    opacity: 0;
    transform: translateY(40px) scale(0.98) blur(8px);
  }

  .card.is-visible {
    opacity: 1;
    transform: translateY(0) scale(1) blur(0);
  }

  .card.inactive::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.02) 50%, transparent 60%);
    animation: scanHologram 8s linear infinite;
    pointer-events: none;
  }

  @keyframes scanHologram {
    0% { transform: translate(-30%, -30%) rotate(0deg); }
    100% { transform: translate(-30%, -30%) rotate(360deg); }
  }

  .card.active::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
    transition: left 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    z-index: 1;
  }

  .card.active:hover {
    transform: translateY(-8px) scale(1.01);
    border-color: var(--border-color);
    box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6), 0 0 40px -10px var(--border-color);
  }

  .card.active:hover::after {
    left: 150%;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }

  .numer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.03);
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--inactive-text);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
    transition: all 0.3s ease;
  }

  .card.active .status-dot {
    background: var(--border-color);
    box-shadow: 0 0 0 3px rgba(255, 90, 54, 0.15), 0 0 15px var(--border-color);
  }

  .nazwa {
    font-weight: 600;
    font-size: 20px;
    line-height: 1.4;
    color: var(--ink);
    min-height: 56px;
    letter-spacing: -0.02em;
    z-index: 2;
    display: flex;
    align-items: center;
  }

  .card.inactive .nazwa {
    color: var(--inactive-text);
  }

  .link-box {
    margin-top: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 18px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid transparent;
    color: var(--inactive-text);
    cursor: default;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,255,255,0.02);
    z-index: 2;
    position: relative;
    overflow: hidden;
  }

  .card.active .link-box {
    border: 1px solid var(--border-color);
    color: var(--border-color-hover);
    cursor: pointer;
    background: rgba(255, 90, 54, 0.05);
  }

  .card.active .link-box:hover {
    background: var(--border-color);
    color: var(--bg);
    box-shadow: 0 10px 30px rgba(255, 90, 54, 0.3);
    transform: translateY(-2px);
  }

  .icon-svg {
    width: 14px;
    height: 14px;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card.active .link-box:hover .icon-svg {
    transform: translate(3px, -3px);
  }

  .back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background: rgba(15, 25, 40, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: translateY(20px) scale(0.8);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .back-to-top.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .back-to-top:hover {
    background: var(--border-color);
    transform: translateY(-3px) scale(1.05);
  }

  .back-to-top svg {
    width: 20px;
    height: 20px;
    color: var(--border-color);
    transition: color 0.3s ease;
  }
  
  .back-to-top:hover svg {
    color: var(--bg);
  }

  footer {
    margin: 100px auto 0;
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding-top: 50px;
    border-top: 1px solid var(--inactive-border);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .footer-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
  }

  .footer-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
  }
  
  .footer-info span {
      display: flex;
      align-items: center;
      gap: 6px;
  }

</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<section class="hero" id="hero">
  <canvas id="spaceCanvas"></canvas>
  
  <div class="black-hole-container" id="blackHole">
    <div class="disk-glow"></div>
    <div class="accretion-disk">
      <div class="disk-layer outer"></div>
      <div class="disk-layer"></div>
    </div>
    <div class="photon-ring"></div>
    <div class="event-horizon"></div>
  </div>

  <div class="hero-text" id="heroText">
    <p class="eyebrow-hero" id="heroCount">Inicjalizacja węzłów...</p>
    <h1 class="wordmark">Vertex<br>Studio</h1>
  </div>

  <div class="scroll-indicator">
    <span>Przewiń w dół</span>
    <div class="scroll-line"></div>
  </div>
</section>

<div class="page">

  <header class="page-header">
    <div>
      <p class="eyebrow">Katalog Projektów</p>
      <h2>Lista linków</h2>
    </div>
    <div class="eyebrow" id="licznik" style="margin: 0;">0 / 0</div>
  </header>

  <div id="grid"></div>

  <footer>
    <div class="footer-logo">VERTEX STUDIO</div>
    <div class="footer-info">
      <span>&copy; 2026 Wszelkie prawa zastrzeżone</span>
      <span>•</span>
      <span>Twórca: Mikołaj G</span>
      <span>•</span>
      <span id="systemClock">System Time: --:--:--</span>
    </div>
  </footer>

</div>

<div class="back-to-top" id="backToTop" title="Wróć na górę">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="19" x2="12" y2="5"></line>
    <polyline points="5 12 12 5 19 12"></polyline>
  </svg>
</div>

<script>
  // ======================================================================
  // TU EDYTUJESZ NAZWY I LINKI
  // ======================================================================
  const links = [
    { nazwa: "Test polityczny", url: "https://testpolityczny.netlify.app", kolor: "#3A86FF" },
    { nazwa: "Strona samo oceny",  url: "https://sites23.vercel.app/" , kolor: "#00E08C" },
    { nazwa: "Strona 3",  url: null },
    { nazwa: "Strona 4",  url: null },
    { nazwa: "Strona 5",  url: null },
    { nazwa: "Strona 6",  url: null },
    { nazwa: "Strona 7",  url: null },
    { nazwa: "Strona 8",  url: null },
    { nazwa: "Strona 9",  url: null },
    { nazwa: "Strona 10", url: null },
    { nazwa: "Strona 11", url: null },
    { nazwa: "Strona 12", url: null },
    { nazwa: "Strona 13", url: null },
    { nazwa: "Strona 14", url: null },
    { nazwa: "Strona 15", url: null },
    { nazwa: "Strona 16", url: null },
    { nazwa: "Strona 17", url: null },
    { nazwa: "Strona 18", url: null },
    { nazwa: "Strona 19", url: null },
    { nazwa: "Strona 20", url: null },
    { nazwa: "Strona 21", url: null },
    { nazwa: "Strona 22", url: null },
    { nazwa: "Strona 23", url: null },
    { nazwa: "Strona 24", url: null },
    { nazwa: "Strona 25", url: null },
    { nazwa: "Strona 26", url: null },
    { nazwa: "Strona 27", url: null },
    { nazwa: "Strona 28", url: null },
    { nazwa: "Strona 29", url: null },
    { nazwa: "Strona 30", url: null },
    { nazwa: "Strona 31", url: null },
    { nazwa: "Strona 32", url: null },
  ];

  const grid = document.getElementById('grid');
  const licznik = document.getElementById('licznik');
  const heroCount = document.getElementById('heroCount');

  const aktywne = links.filter(item => !!item.url).length;
  licznik.textContent = `${aktywne} / ${links.length} pozycji aktywnych`;
  heroCount.textContent = `${links.length} węzłów / ${aktywne} aktywne`;

  const arrowSvg = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>';
  const lockSvg = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

  links.forEach((item, i) => {
    const isActive = !!item.url;
    const card = document.createElement('div');
    card.className = 'card ' + (isActive ? 'active' : 'inactive');
    
    if (item.kolor) {
      card.style.setProperty('--border-color', item.kolor);
      card.style.setProperty('--border-color-hover', item.kolor);
    }

    card.innerHTML = `
      <div class="card-top">
        <span class="numer">NODE_${String(i + 1).padStart(2, '0')}</span>
        <div class="status-dot"></div>
      </div>
      <div class="nazwa">${item.nazwa}</div>
    `;

    const linkBox = document.createElement(isActive ? 'a' : 'div');
    linkBox.className = 'link-box';
    if (isActive) {
      linkBox.href = item.url;
      linkBox.target = '_blank';
      linkBox.rel = 'noopener noreferrer';
      linkBox.innerHTML = `Otwórz link ${arrowSvg}`;
    } else {
      linkBox.innerHTML = `Zablokowane ${lockSvg}`;
    }

    card.appendChild(linkBox);
    grid.appendChild(card);
  });

  // ---------- Zaawansowane Animacje Scroll Reveal ----------
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const delay = Array.from(entry.target.parentNode.children).indexOf(entry.target) % 4 * 80;
        setTimeout(() => {
          entry.target.classList.add('is-visible');
        }, delay);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.card').forEach(card => observer.observe(card));

  // ---------- Symulacja Czarnej Dziury (Canvas) ----------
  const canvas = document.getElementById('spaceCanvas');
  const ctx = canvas.getContext('2d');
  const heroSection = document.getElementById('hero');
  const heroText = document.getElementById('heroText');
  const blackHole = document.getElementById('blackHole');
  
  let width, height, centerX, centerY, blackHoleRadius;
  let particles = [];
  let isTouchDevice = window.matchMedia("(hover: none)").matches;

  function resize() {
    width = canvas.width = heroSection.offsetWidth;
    height = canvas.height = heroSection.offsetHeight;
    centerX = width / 2;
    centerY = height / 2;
    
    // Obliczanie promienia na podstawie wielkości kontenera CSS (28% z clamp)
    const containerSize = Math.max(400, Math.min(700, Math.min(width, height) * 0.7));
    blackHoleRadius = containerSize * 0.14; 
  }
  window.addEventListener('resize', resize);
  resize();

  // Klasa cząsteczki
  class Particle {
    constructor() { this.reset(true); }
    
    reset(initial = false) {
      const angle = Math.random() * Math.PI * 2;
      const dist = initial ? Math.random() * 800 + 100 : Math.random() * 200 + 700;
      this.x = Math.cos(angle) * dist;
      this.y = Math.sin(angle) * dist;
      this.vx = -Math.sin(angle) * (1 + Math.random() * 2);
      this.vy = Math.cos(angle) * (1 + Math.random() * 2);
      this.size = Math.random() * 1.5 + 0.5;
      this.color = Math.random() > 0.5 ? '255, 90, 54' : '255, 255, 255';
    }

    update() {
      // Translacja do środka
      const tx = this.x + centerX;
      const ty = this.y + centerY;
      const dx = centerX - tx;
      const dy = centerY - ty;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);

      // Grawitacja rośnie kwadratowo w miarę zbliżania się
      const force = 1500 / distSq;
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;

      // Ograniczenie prędkości
      const maxSpeed = 15;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      this.x += this.vx;
      this.y += this.vy;

      // Reset wpadając do środka
      if (dist < blackHoleRadius) {
        this.reset();
      }
    }

    draw() {
      const tx = this.x + centerX;
      const ty = this.y + centerY;
      
      // Rysowanie rozciągniętej smugi zamiast kropki (efekt relatywistyczny)
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - this.vx * 3, ty - this.vy * 3);
      ctx.strokeStyle = `rgba(${this.color}, 0.8)`;
      ctx.lineWidth = this.size;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  function initParticles() {
    particles = [];
    const count = isTouchDevice ? 150 : 400;
    for(let i=0; i<count; i++) particles.push(new Particle());
  }
  initParticles();

  function animateBlackHole() {
    // Ślad po cząsteczkach (black transparent)
    ctx.fillStyle = 'rgba(4, 5, 10, 0.15)';
    ctx.fillRect(0, 0, width, height);
    
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateBlackHole);
  }
  animateBlackHole();

  // ---------- Parallax tylko dla urządzeń z myszką ----------
  if (!isTouchDevice) {
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    heroSection.addEventListener('mousemove', (e) => {
      const { clientX, clientY, currentTarget } = e;
      const rect = currentTarget.getBoundingClientRect();
      targetX = (clientX - rect.left) / rect.width - 0.5;
      targetY = (clientY - rect.top) / rect.height - 0.5;
    });

    heroSection.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
    });

    function animateParallax() {
      currentX += (targetX - currentX) * 0.05;
      currentY += (targetY - currentY) * 0.05;

      // Ruch dziury w przeciwną stronę
      blackHole.style.transform = `translate(calc(-50% + ${currentX * -30}px), calc(-50% + ${currentY * -20}px))`;
      // Ruch tekstu
      heroText.style.transform = `translate(${currentX * 20}px, ${currentY * 15}px)`;

      requestAnimationFrame(animateParallax);
    }
    animateParallax();
  }

  // ---------- Przycisk Back to Top ----------
  const backToTopBtn = document.getElementById('backToTop');
  
  window.addEventListener('scroll', () => {
    if (window.scrollY > 600) {
      backToTopBtn.classList.add('visible');
    } else {
      backToTopBtn.classList.remove('visible');
    }
  });

  backToTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- Zegar w stopce ----------
  function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('pl-PL', { hour12: false });
    document.getElementById('systemClock').textContent = `System Time: ${timeString}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

</script>

</body>
</html>
