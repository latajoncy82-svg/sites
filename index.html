<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog linków</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ======================================================
     TU ZMIENIASZ KOLOR OBRAMOWANIA LINKÓW
     Podmień poniższą wartość na dowolny kolor (np. #E63946)
     ====================================================== */
  :root {
    --border-color: #2F6F6B;   /* <-- EDYTUJ TUTAJ kolor obramowania kart/linków */
    --border-color-hover: #1F4E4B;

    --bg: #EEF1EF;
    --surface: #FFFFFF;
    --ink: #16211E;
    --muted: #66756F;
    --inactive-border: #C8CFCB;
    --inactive-text: #97A29C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 48px 24px 80px;
  }

  header {
    max-width: 960px;
    margin: 0 auto 40px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--border-color);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .instrukcja {
    max-width: 680px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
    background: var(--surface);
    border-left: 3px solid var(--border-color);
    padding: 14px 18px;
    border-radius: 4px;
  }

  .instrukcja code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 13px;
  }

  #grid {
    max-width: 960px;
    margin: 36px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 2px solid var(--inactive-border);
    border-radius: 8px;
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .card.active {
    border-color: var(--border-color);
  }

  .card.active:hover {
    border-color: var(--border-color-hover);
    transform: translateY(-2px);
  }

  .numer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .nazwa {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.3;
  }

  .card.inactive .nazwa {
    color: var(--ink);
  }

  .link-box {
    margin-top: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    text-decoration: none;
    padding: 7px 10px;
    border-radius: 5px;
    text-align: center;
    border: 1px dashed var(--inactive-border);
    color: var(--inactive-text);
    cursor: default;
  }

  .card.active .link-box {
    border: 1px solid var(--border-color);
    color: var(--border-color);
    cursor: pointer;
  }

  .card.active .link-box:hover {
    background: var(--border-color);
    color: #fff;
  }

  footer {
    max-width: 960px;
    margin: 40px auto 0;
    font-size: 12.5px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

</style>
</head>
<body>

<header>
  <p class="eyebrow">Katalog / 32 pozycje</p>
  <h1>Lista linków</h1>
</header>

<div id="grid"></div>

<footer id="licznik">32 / 32 pozycji</footer>

<script>
  // ======================================================================
  // TU EDYTUJESZ NAZWY I LINKI
  //
  // Każda pozycja to jedna linia poniżej. Format:
  //   { nazwa: "Nazwa strony", url: "https://adres-strony.pl" },
  //
  // Jeśli chcesz, żeby karta była NIEAKTYWNA (jeszcze bez linku), wpisz:
  //   { nazwa: "Nazwa strony", url: null },
  //
  // Żeby DODAĆ pozycję -> dopisz nową linię na końcu listy.
  // Żeby USUNĄĆ pozycję -> skasuj całą linię.
  // Liczba pozycji na górze i na dole strony aktualizuje się sama.
  // ======================================================================
  const links = [
    { nazwa: "Test polityczny",  url:"testpolityczny.netlify.app" },
    { nazwa: "Strona 2",  url: null },
    { nazwa: "Strona 3",  url: null },
    { nazwa: "Strona 4",  url: null },
    { nazwa: "Strona 5",  url: null },
    { nazwa: "Strona 6",  url: null },
    { nazwa: "Strona 7",  url: null },
    { nazwa: "Strona 8",  url: null },
    { nazwa: "Strona 9",  url: null },
    { nazwa: "Strona 10", url: null },
    { nazwa: "Strona 11", url: null },
    { nazwa: "Strona 12", url: null },
    { nazwa: "Strona 13", url: null },
    { nazwa: "Strona 14", url: null },
    { nazwa: "Strona 15", url: null },
    { nazwa: "Strona 16", url: null },
    { nazwa: "Strona 17", url: null },
    { nazwa: "Strona 18", url: null },
    { nazwa: "Strona 19", url: null },
    { nazwa: "Strona 20", url: null },
    { nazwa: "Strona 21", url: null },
    { nazwa: "Strona 22", url: null },
    { nazwa: "Strona 23", url: null },
    { nazwa: "Strona 24", url: null },
    { nazwa: "Strona 25", url: null },
    { nazwa: "Strona 26", url: null },
    { nazwa: "Strona 27", url: null },
    { nazwa: "Strona 28", url: null },
    { nazwa: "Strona 29", url: null },
    { nazwa: "Strona 30", url: null },
    { nazwa: "Strona 31", url: null },
    { nazwa: "Strona 32", url: null },
  ];

  const grid = document.getElementById('grid');
  const eyebrow = document.querySelector('.eyebrow');
  const licznik = document.getElementById('licznik');

  const aktywne = links.filter(item => !!item.url).length;
  eyebrow.textContent = `Katalog / ${links.length} pozycji`;
  licznik.textContent = `${aktywne} / ${links.length} pozycji aktywnych`;

  links.forEach((item, i) => {
    const isActive = !!item.url;

    const card = document.createElement('div');
    card.className = 'card ' + (isActive ? 'active' : 'inactive');

    const numer = document.createElement('div');
    numer.className = 'numer';
    numer.textContent = String(i + 1).padStart(2, '0');

    const nazwa = document.createElement('div');
    nazwa.className = 'nazwa';
    nazwa.textContent = item.nazwa;

    const linkBox = document.createElement(isActive ? 'a' : 'div');
    linkBox.className = 'link-box';
    if (isActive) {
      linkBox.href = item.url;
      linkBox.target = '_blank';
      linkBox.rel = 'noopener noreferrer';
      linkBox.textContent = 'Otwórz →';
    } else {
      linkBox.textContent = 'Link nieaktywny';
    }

    card.appendChild(numer);
    card.appendChild(nazwa);
    card.appendChild(linkBox);
    grid.appendChild(card);
  });
</script>

</body>
</html>
